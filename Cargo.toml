[package]
name = "roc_host"
version = "0.4.0"
edition = "2021"

[lib]
name = "host"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "host"
path = "src/main.rs"

[dependencies]
# Pinned to the version rustls uses, with the same features, so there's one
# AWS-LC build, not two (`Crypto` uses it directly).
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys"] }
corosensei = "0.3.4"
libc = "0.2.189"
mio = { version = "1.2.3", features = ["os-poll", "net", "os-ext"] }
rustls = "0.23.45"
rustls-pki-types = { version = "1.15.1", features = ["std"] }
slab = "0.4.12"
webpki-roots = "1.0.9"

[profile.release]
lto = true
strip = "debuginfo"
panic = "abort"
